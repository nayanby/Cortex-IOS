name: Cortex
options:
  bundleIdPrefix: com.cortex
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    MARKETING_VERSION: '1.0.0'
    CURRENT_PROJECT_VERSION: '1'
targets:
  Cortex:
    type: application
    platform: iOS
    sources:
      - path: Cortex
        excludes: [Resources]
      - path: Cortex/Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cortex.notes
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Cortex
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    info:
      path: Generated/Info.plist
      properties:
        UIAppFonts:
          - averia_serif_libre_regular.ttf
          - averia_serif_libre_bold.ttf
          - averia_serif_libre_italic.ttf
          - averia_serif_libre_bold_italic.ttf
schemes:
  Cortex:
    build:
      targets:
        Cortex: all
    run:
      config: Debug
    archive:
      config: Release
