name: Cortex
options:
  bundleIdPrefix: com.cortex
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    MARKETING_VERSION: '1.0.0'
    CURRENT_PROJECT_VERSION: '1'
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    exactVersion: 12.19.3
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    exactVersion: 9.2.0
targets:
  Cortex:
    type: application
    platform: iOS
    sources:
      - path: Cortex
        excludes: [Resources]
      - path: Cortex/Resources
        excludes: [Reader]
        buildPhase: resources
      - path: Cortex/Resources/Reader
        type: folder
        buildPhase: resources
      - path: Config
        excludes: [README.md, '*.xcconfig']
        buildPhase: resources
    dependencies:
      - package: Firebase
        product: FirebaseCore
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseStorage
      - package: Firebase
        product: FirebaseAppCheck
      - package: GoogleSignIn
        product: GoogleSignIn
    configFiles:
      Debug: Config/Firebase.generated.xcconfig
      Release: Config/Firebase.generated.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cortex.notes
        # Keep development builds usable until the final iOS icon set is supplied.
        ASSETCATALOG_COMPILER_APPICON_NAME: ''
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Cortex
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    info:
      path: Generated/Info.plist
      properties:
        FirebaseAppDelegateProxyEnabled: false
        CFBundleURLTypes:
          - CFBundleURLSchemes: ['$(CORTEX_GOOGLE_URL_SCHEME)']
        UIAppFonts:
          - averia_serif_libre_regular.ttf
          - averia_serif_libre_bold.ttf
          - averia_serif_libre_italic.ttf
          - averia_serif_libre_bold_italic.ttf
  CortexTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CortexTests
        excludes: [Fixtures]
      - path: CortexTests/Fixtures
        type: folder
        buildPhase: resources
    dependencies:
      - target: Cortex
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Cortex:
    build:
      targets:
        Cortex: all
    run:
      config: Debug
    archive:
      config: Release
    test:
      environmentVariables:
        CORTEX_TEST_EMULATORS: '1'
      targets:
        - CortexTests
