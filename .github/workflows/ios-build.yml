name: iOS simulator build
on:
  workflow_dispatch:
  push:
    branches: [main, master, 'codex/**']
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install project generator
        run: brew install xcodegen
      - name: Prepare optional private Firebase configuration
        env:
          CORTEX_FIREBASE_PLIST: ${{ secrets.FIREBASE_IOS_CONFIG_PLIST }}
        run: python3 scripts/prepare-firebase.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Generate Xcode project
        run: xcodegen generate
      - uses: actions/cache/restore@v4
        id: dependencies
        with:
          path: |
            .spm-cache
            build/Build/Intermediates.noindex
            build/ModuleCache.noindex
            test-build/Build/Intermediates.noindex
            test-build/ModuleCache.noindex
          key: ios-compile-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('project.yml') }}-${{ github.sha }}
          restore-keys: ios-compile-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('project.yml') }}-
      - name: Build for simulator without signing
        run: >-
          xcodebuild -project Cortex.xcodeproj -scheme Cortex
          -configuration Debug -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -clonedSourcePackagesDirPath .spm-cache -derivedDataPath build ONLY_ACTIVE_ARCH=YES ARCHS=arm64 CODE_SIGNING_ALLOWED=NO build
      - name: Prepare browser simulator build with Keychain access
        run: |
          codesign --force --sign - --entitlements test-backend/Simulator.entitlements build/Build/Products/Debug-iphonesimulator/Cortex.app
          ditto -c -k --keepParent build/Build/Products/Debug-iphonesimulator/Cortex.app build/Cortex-Appetize.zip
      - name: Save browser test package
        uses: actions/upload-artifact@v4
        with:
          name: Cortex-Appetize
          path: build/Cortex-Appetize.zip
          if-no-files-found: error
      - name: Prepare matching private iPad sideload configuration
        env:
          CORTEX_FIREBASE_PLIST: ${{ secrets.FIREBASE_IOS_SIDELOAD_CONFIG_PLIST || secrets.FIREBASE_IOS_CONFIG_PLIST }}
          CORTEX_REPLACE_FIREBASE_CONFIG: '1'
        run: python3 scripts/prepare-firebase.py
      - name: Build unsigned app for iPad and iPhone
        run: >-
          xcodebuild -project Cortex.xcodeproj -scheme Cortex
          -configuration Debug -sdk iphoneos
          -destination 'generic/platform=iOS'
          -clonedSourcePackagesDirPath .spm-cache -derivedDataPath device-build
          CODE_SIGNING_ALLOWED=NO build
      - name: Package device IPA for local signing on Windows
        run: |
          mkdir -p device-package/Payload
          ditto device-build/Build/Products/Debug-iphoneos/Cortex.app device-package/Payload/Cortex.app
          cd device-package
          zip -qry Cortex-iPad-Unsigned.ipa Payload
      - name: Save device IPA
        uses: actions/upload-artifact@v4
        with:
          name: Cortex-iPad-Unsigned
          path: device-package/Cortex-iPad-Unsigned.ipa
          if-no-files-found: error
      - name: Restore standard client configuration for simulator tests
        if: always()
        env:
          CORTEX_FIREBASE_PLIST: ${{ secrets.FIREBASE_IOS_CONFIG_PLIST }}
          CORTEX_REPLACE_FIREBASE_CONFIG: '1'
        run: python3 scripts/prepare-firebase.py
      - name: Run account, download and reader integration tests
        timeout-minutes: 20
        run: |
          npx --yes firebase-tools@15.34.1 emulators:exec --project demo-cortex-ios --config test-backend/firebase.json --only auth,firestore,storage 'bash scripts/run-ios-emulator-tests.sh'
      - name: Save emulator diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Cortex-EmulatorLogs
          path: |
            *-debug.log
            test-backend/*-debug.log
      - uses: actions/cache/save@v4
        if: always() && !cancelled() && steps.dependencies.outputs.cache-hit != 'true'
        with:
          path: |
            .spm-cache
            build/Build/Intermediates.noindex
            build/ModuleCache.noindex
            test-build/Build/Intermediates.noindex
            test-build/ModuleCache.noindex
          key: ${{ steps.dependencies.outputs.cache-primary-key }}
      - name: Save test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Cortex-ReaderTests
          path: build/ReaderTests.xcresult
      - name: Save simulator app
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Cortex-iOS-Simulator
          path: build/Build/Products/Debug-iphonesimulator/Cortex.app
          if-no-files-found: error
